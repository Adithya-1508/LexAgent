[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uae-lexagent"
version = "0.1.0"
description = "Evaluation-driven bilingual legal agent foundations"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]
retrieval = [
    "numpy>=1.26.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",
]
qdrant = [
    "qdrant-client>=1.9.0",
]
openai = [
    "openai>=1.20.0",
]
agent = [
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

