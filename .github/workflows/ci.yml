name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: python -m ruff check .

      - name: Run Ruff format check
        run: python -m ruff format --check .

  type-check:
    name: Static Type Analysis (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install all typed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,retrieval,qdrant,embeddings,openai,agent]"

      - name: Run mypy
        run: python -m mypy src/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,retrieval,qdrant,agent]"

      - name: Run test suite with JUnit XML output
        run: |
          mkdir -p reports
          python -m pytest -q --junitxml=reports/test-results.xml

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py312
          path: reports/test-results.xml
          retention-days: 14

  package:
    name: Packaging & Distribution Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Test clean wheel installation
        run: |
          python -m pip install dist/*.whl
          python -c "import uae_lexagent; print('Installed uae-lexagent successfully from', uae_lexagent.__file__)"

  optional-matrix:
    name: Optional Dependencies (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "core-minimal"
            install: ".[dev]"
            test_target: "tests/test_models.py tests/test_ingestion.py tests/test_tools.py tests/test_routing.py"
          - name: "retrieval-qdrant"
            install: ".[dev,retrieval,qdrant]"
            test_target: "tests/test_retrieval.py"
          - name: "agent-orchestrator"
            install: ".[dev,retrieval,agent]"
            test_target: "tests/test_agent.py tests/test_synthesis.py"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install subset ${{ matrix.name }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${{ matrix.install }}"

      - name: Run targeted test suite
        run: python -m pytest -q ${{ matrix.test_target }}
