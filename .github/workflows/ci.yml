name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Format & Static Type Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,retrieval,qdrant,agent]"

      - name: Run Ruff lint check
        run: python -m ruff check .

      - name: Run Ruff format check
        run: python -m ruff format --check .

      - name: Run Mypy static type analysis
        run: python -m mypy src/

  unit-tests:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,retrieval,qdrant,agent]"

      - name: Run test suite with JUnit XML
        run: |
          mkdir -p reports
          python -m pytest -q --junitxml=reports/test-results-${{ matrix.python-version }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: reports/test-results-${{ matrix.python-version }}.xml
          retention-days: 14

  legal-safety:
    name: Legal Safety & Invariant Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,retrieval,agent]"

      - name: Run legal safety tests
        run: python -m pytest -q -m legal_safety

  corpus-benchmark-integrity:
    name: Corpus & Benchmark Integrity Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,retrieval,agent]"

      - name: Run explicit corpus and benchmark validation CLI
        run: python -m uae_lexagent.evaluation.validate

      - name: Validate corpus manifests, checksums, and evaluation loader via pytest
        run: python -m pytest -q tests/test_evaluation.py tests/test_ingestion.py

  dependency-isolation:
    name: Isolated Dependencies (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "core-minimal"
            install: ".[dev]"
            test_target: "tests/test_models.py tests/test_ingestion.py tests/test_tools.py tests/test_routing.py"
          - name: "retrieval-qdrant"
            install: ".[dev,retrieval,qdrant]"
            test_target: "tests/test_retrieval.py"
          - name: "agent-orchestrator"
            install: ".[dev,retrieval,agent]"
            test_target: "tests/test_agent.py tests/test_synthesis.py tests/test_legal_safety.py"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install isolated target subset
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${{ matrix.install }}"

      - name: Run targeted test suite
        run: python -m pytest -q ${{ matrix.test_target }}

  packaging:
    name: Distribution Package & Clean Installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Test clean wheel installation in isolated environment outside source checkout
        run: |
          python -m venv /tmp/isolated_packaging_venv
          source /tmp/isolated_packaging_venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import uae_lexagent; print('Installed uae-lexagent successfully from', uae_lexagent.__file__); assert '/tmp/isolated_packaging_venv' in uae_lexagent.__file__"
          python -c "from uae_lexagent.models import LegalQuery, Jurisdiction, Language; q = LegalQuery(query_id='smoke', text='smoke test', jurisdiction=Jurisdiction.UAE_ONSHORE, language=Language.EN); print('Smoke model passed:', q.query_id)"
          python -c "from uae_lexagent.tools import calculate_gratuity; res = calculate_gratuity(10000, 2); print('Smoke tool passed:', res['total_gratuity'])"

  security-scan:
    name: Static Security Scan (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Run Bandit static security scan
        run: bandit -r src/ -ll -q

  vulnerability-audit:
    name: Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,retrieval,qdrant,agent]"
          python -m pip install pip-audit

      - name: Run pip-audit scan
        run: python -m pip_audit --desc
