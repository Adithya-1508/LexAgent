# yaml-language-server: $schema=https://lefthook.dev/schema.json
min_version: 2.2.2
assert_lefthook_installed: true
no_auto_install: true
glob_matcher: doublestar

output:
  - summary
  - failure

pre-commit:
  parallel: true
  commands:
    ruff-lint:
      glob: "**/*.py"
      run: uv run --no-sync --offline ruff check -- {staged_files}
    ruff-format:
      glob: "**/*.py"
      run: uv run --no-sync --offline ruff format --check -- {staged_files}

pre-push:
  parallel: false
  commands:
    mypy:
      files: git ls-files -- pyproject.toml
      run: uv run --no-sync --offline mypy --config-file {files} src/
    legal-safety:
      files: git ls-files -- pyproject.toml
      run: uv run --no-sync --offline pytest -c {files} -q -m legal_safety
